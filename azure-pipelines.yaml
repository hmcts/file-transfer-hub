trigger:
  batch: true
  branches:
    include:
      - main

pr:
  - main

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: "hmcts"

parameters:
  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy
  - name: refreshAlertsOnly
    displayName: "Refresh alert email addresses only (skip image build)"
    type: boolean
    default: false
  - name: refreshCertificateEnvironment
    displayName: "Restart Container App to reload renewed certificate from Key Vault"
    type: string
    default: none
    values:
      - none
      - nonprod
      - prod
  - name: refreshSecretsEnvironment
    displayName: "Sync all FTPS runtime secrets from Key Vault into the Container App"
    type: string
    default: none
    values:
      - none
      - nonprod
      - prod

variables:
  - name: timeoutInMinutes
    value: 60
  - name: agentImage
    value: ubuntu-latest
  - name: product
    value: hub
  - name: terraformInitSubscription
    value: 04d27a32-7a07-48b3-95b8-3c8691e1a263
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries
  - name: imageRepository
    value: file-transfer-hub/ftps-server

stages:
  - stage: TerraformPrecheck
    dependsOn: []
    jobs:
      - job: TerraformPrecheck
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: "infra-vault-nonprod"
              keyvaultSecret: "azure-devops-sp-token"
              serviceConnection: "azurerm-sandbox"
              overrideAction: ${{ parameters.overrideAction }}

  - stage: AppBuildPublish
    displayName: "App Build & Publish"
    dependsOn: []
    condition: and(succeeded(), eq('${{ parameters.refreshCertificateEnvironment }}', 'none'), eq('${{ parameters.refreshSecretsEnvironment }}', 'none'), ne('${{ parameters.refreshAlertsOnly }}', 'true'))
    jobs:
      - job: BuildAndPublish
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Build and push Docker image to ACR (az acr build)"
            inputs:
              azureSubscription: DCD-CNP-Prod
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(System.DefaultWorkingDirectory)/app
              inlineScript: |
                echo "Starting ACR build for $(imageRepository)"

                # Determine the correct branch name
                if [ "$(Build.Reason)" = "PullRequest" ]; then
                  BRANCH_NAME="$(System.PullRequest.SourceBranch)"
                else
                  BRANCH_NAME="$(Build.SourceBranch)"
                fi

                # Remove refs/heads/ prefix if present
                BRANCH_NAME="${BRANCH_NAME#refs/heads/}"

                # Replace / with - for valid Docker tag names
                BRANCH_NAME="${BRANCH_NAME//\//-}"

                echo "Using branch name: $BRANCH_NAME"

                az acr build --registry hmctsprod \
                  -t $(imageRepository):$(Build.BuildId) \
                  -t $(imageRepository):$BRANCH_NAME \
                  -t $(imageRepository):$BRANCH_NAME-$(Build.BuildId) \
                  .

  - template: pipeline-templates/deployment-stages.yaml
    parameters:
      overrideAction: ${{ parameters.overrideAction }}
      refreshCertificateEnvironment: ${{ parameters.refreshCertificateEnvironment }}
      refreshSecretsEnvironment: ${{ parameters.refreshSecretsEnvironment }}
      refreshAlertsOnly: ${{ parameters.refreshAlertsOnly }}
      agentImage: ${{ variables.agentImage }}
      timeoutInMinutes: ${{ variables.timeoutInMinutes }}
      product: ${{ variables.product }}
      terraformInitSubscription: ${{ variables.terraformInitSubscription }}

  - stage: RefreshCertificate
    displayName: "Reload renewed certificate from Key Vault"
    dependsOn:
      - TerraformPrecheck
    condition: >-
      and(
        succeeded('TerraformPrecheck'),
        ne('${{ parameters.refreshCertificateEnvironment }}', 'none')
      )
    jobs:
      - job: RestartNonprodContainerApp
        displayName: "Restart active nonprod Container App revision(s)"
        condition: eq('${{ parameters.refreshCertificateEnvironment }}', 'nonprod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Restart active nonprod Container App revision(s)"
            inputs:
              azureSubscription: HMCTS-HUB-NONPROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                CONTAINER_APP_NAME="hub-fth-ftps-server-nonprod"
                RESOURCE_GROUP="file-transfer-hub-nonprod-rg"
                KEY_VAULT_NAME="acmedcdcftappsdemo"
                KEY_VAULT_SECRET_NAME="dtsft-demo-apps-hmcts-net"

                CERT_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_PEM'].secretRef | [0]" \
                  --output tsv)

                KEY_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_KEY_PEM'].secretRef | [0]" \
                  --output tsv)

                if [[ -z "$CERT_SECRET_REF" ]]; then
                  echo "FTPS_CERTIFICATE_PEM secretRef was not found on $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                CERTIFICATE_VALUE=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$KEY_VAULT_SECRET_NAME" \
                  --query value \
                  --output tsv)

                if [[ -z "$CERTIFICATE_VALUE" ]]; then
                  echo "Key Vault secret $KEY_VAULT_SECRET_NAME in $KEY_VAULT_NAME returned an empty value" >&2
                  exit 1
                fi

                SECRET_ARGS=("$CERT_SECRET_REF=$CERTIFICATE_VALUE")
                if [[ -n "$KEY_SECRET_REF" && "$KEY_SECRET_REF" != "$CERT_SECRET_REF" ]]; then
                  SECRET_ARGS+=("$KEY_SECRET_REF=$CERTIFICATE_VALUE")
                fi

                echo "Syncing latest certificate secret from $KEY_VAULT_NAME into $CONTAINER_APP_NAME"
                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "${SECRET_ARGS[@]}"

                echo "Looking up active revisions for $CONTAINER_APP_NAME in $RESOURCE_GROUP"

                ACTIVE_REVISIONS=$(az containerapp revision list \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[?properties.active].name" \
                  --output tsv)

                if [[ -z "$ACTIVE_REVISIONS" ]]; then
                  echo "No active revisions found for $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                while IFS= read -r revision; do
                  [[ -z "$revision" ]] && continue
                  echo "Restarting revision: $revision"
                  az containerapp revision restart \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$revision"
                done <<< "$ACTIVE_REVISIONS"
      - job: RestartProdContainerApp
        displayName: "Restart active prod Container App revision(s)"
        condition: eq('${{ parameters.refreshCertificateEnvironment }}', 'prod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Restart active prod Container App revision(s)"
            inputs:
              azureSubscription: HMCTS-HUB-PROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                CONTAINER_APP_NAME="hub-fth-ftps-server-prod"
                RESOURCE_GROUP="file-transfer-hub-prod-rg"
                KEY_VAULT_NAME="acmehmctshubprodintsvc"
                KEY_VAULT_SECRET_NAME="dtsft-prod-apps-hmcts-net"

                CERT_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_PEM'].secretRef | [0]" \
                  --output tsv)

                KEY_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_KEY_PEM'].secretRef | [0]" \
                  --output tsv)

                if [[ -z "$CERT_SECRET_REF" ]]; then
                  echo "FTPS_CERTIFICATE_PEM secretRef was not found on $CONTAINER_APP_NAME"                  git status
                  git --no-pager diff -- azure-pipelines.yaml pipeline-templates/deployment-stages.yaml >&2
                  exit 1
                fi

                CERTIFICATE_VALUE=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$KEY_VAULT_SECRET_NAME" \
                  --query value \
                  --output tsv)

                if [[ -z "$CERTIFICATE_VALUE" ]]; then
                  echo "Key Vault secret $KEY_VAULT_SECRET_NAME in $KEY_VAULT_NAME returned an empty value" >&2
                  exit 1
                fi

                SECRET_ARGS=("$CERT_SECRET_REF=$CERTIFICATE_VALUE")
                if [[ -n "$KEY_SECRET_REF" && "$KEY_SECRET_REF" != "$CERT_SECRET_REF" ]]; then
                  SECRET_ARGS+=("$KEY_SECRET_REF=$CERTIFICATE_VALUE")
                fi

                echo "Syncing latest certificate secret from $KEY_VAULT_NAME into $CONTAINER_APP_NAME"
                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "${SECRET_ARGS[@]}"

                echo "Looking up active revisions for $CONTAINER_APP_NAME in $RESOURCE_GROUP"

                ACTIVE_REVISIONS=$(az containerapp revision list \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[?properties.active].name" \
                  --output tsv)

                if [[ -z "$ACTIVE_REVISIONS" ]]; then
                  echo "No active revisions found for $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                while IFS= read -r revision; do
                  [[ -z "$revision" ]] && continue
                  echo "Restarting revision: $revision"
                  az containerapp revision restart \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$revision"
                done <<< "$ACTIVE_REVISIONS"
  - stage: RefreshSecrets
    displayName: "Reload FTPS runtime secrets from Key Vault"
    dependsOn:
      - TerraformPrecheck
    condition: >-
      and(
        succeeded('TerraformPrecheck'),
        ne('${{ parameters.refreshSecretsEnvironment }}', 'none')
      )
    jobs:
      - job: RefreshNonprodContainerAppSecrets
        displayName: "Refresh nonprod FTPS Container App secrets"
        condition: eq('${{ parameters.refreshSecretsEnvironment }}', 'nonprod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Refresh nonprod FTPS Container App secrets"
            inputs:
              azureSubscription: HMCTS-HUB-NONPROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                CONTAINER_APP_NAME="hub-fth-ftps-server-nonprod"
                RESOURCE_GROUP="file-transfer-hub-nonprod-rg"

                SECRET_MAPPINGS=(
                  "FTPS_LOCAL_USER|file-tran-hub-nonprod-kv|ftps-local-username"
                  "FTPS_LOCAL_PASSWORD|file-tran-hub-nonprod-kv|ftps-local-password"
                  "FTPS_CERTIFICATE_PEM|acmedcdcftappsdemo|dtsft-demo-apps-hmcts-net"
                  "FTPS_CERTIFICATE_KEY_PEM|acmedcdcftappsdemo|dtsft-demo-apps-hmcts-net"
                  "FTPS_FORWARD_TARGET_0_USERNAME|file-tran-hub-nonprod-kv|ftps-storage-sftp-username"
                  "FTPS_FORWARD_TARGET_0_PASSWORD|file-tran-hub-nonprod-kv|ftps-storage-sftp-password"
                  "FTPS_FORWARD_TARGET_1_HOST|file-tran-hub-nonprod-kv|LEDS2BAIS-DEMO-FTPS-destination"
                  "FTPS_FORWARD_TARGET_1_USERNAME|file-tran-hub-nonprod-kv|LEDS2BAIS-DEMO-FTPS-Username"
                  "FTPS_FORWARD_TARGET_1_PASSWORD|file-tran-hub-nonprod-kv|LEDS2BAIS-DEMO-FTPS-Password"
                  "FTPS_ADDITIONAL_USER|file-tran-hub-nonprod-kv|ho-moj-ftps-demo-username"
                  "FTPS_ADDITIONAL_PASSWORD|file-tran-hub-nonprod-kv|ho-moj-ftps-demo-password"
                )

                declare -A SECRET_ARGS_BY_REF=()
                SECRET_ARGS=()

                for mapping in "${SECRET_MAPPINGS[@]}"; do
                  IFS='|' read -r env_name key_vault_name key_vault_secret_name <<< "$mapping"

                  secret_ref=$(az containerapp show \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --query "properties.template.containers[0].env[?name=='${env_name}'].secretRef | [0]" \
                    --output tsv)

                  if [[ -z "$secret_ref" ]]; then
                    echo "$env_name secretRef was not found on $CONTAINER_APP_NAME" >&2
                    exit 1
                  fi

                  secret_value=$(az keyvault secret show \
                    --vault-name "$key_vault_name" \
                    --name "$key_vault_secret_name" \
                    --query value \
                    --output tsv)

                  if [[ -z "$secret_value" ]]; then
                    echo "Key Vault secret $key_vault_secret_name in $key_vault_name returned an empty value" >&2
                    exit 1
                  fi

                  SECRET_ARGS_BY_REF["$secret_ref"]="$secret_value"
                done

                for secret_ref in "${!SECRET_ARGS_BY_REF[@]}"; do
                  SECRET_ARGS+=("$secret_ref=${SECRET_ARGS_BY_REF[$secret_ref]}")
                done

                echo "Syncing FTPS runtime secrets into $CONTAINER_APP_NAME"
                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "${SECRET_ARGS[@]}"

                ACTIVE_REVISIONS=$(az containerapp revision list \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[?properties.active].name" \
                  --output tsv)

                if [[ -z "$ACTIVE_REVISIONS" ]]; then
                  echo "No active revisions found for $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                while IFS= read -r revision; do
                  [[ -z "$revision" ]] && continue
                  echo "Restarting revision: $revision"
                  az containerapp revision restart \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$revision"
                done <<< "$ACTIVE_REVISIONS"
      - job: RefreshProdContainerAppSecrets
        displayName: "Refresh prod FTPS Container App secrets"
        condition: eq('${{ parameters.refreshSecretsEnvironment }}', 'prod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Refresh prod FTPS Container App secrets"
            inputs:
              azureSubscription: HMCTS-HUB-PROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                CONTAINER_APP_NAME="hub-fth-ftps-server-prod"
                RESOURCE_GROUP="file-transfer-hub-prod-rg"

                SECRET_MAPPINGS=(
                  "FTPS_LOCAL_USER|file-tran-hub-prod-kv|ftps-local-username"
                  "FTPS_LOCAL_PASSWORD|file-tran-hub-prod-kv|ftps-local-password"
                  "FTPS_CERTIFICATE_PEM|acmehmctshubprodintsvc|dtsft-prod-apps-hmcts-net"
                  "FTPS_CERTIFICATE_KEY_PEM|acmehmctshubprodintsvc|dtsft-prod-apps-hmcts-net"
                  "FTPS_FORWARD_TARGET_0_USERNAME|file-tran-hub-prod-kv|ftps-storage-sftp-username-v2"
                  "FTPS_FORWARD_TARGET_0_PASSWORD|file-tran-hub-prod-kv|ftps-storage-sftp-password-v2"
                  "FTPS_FORWARD_TARGET_1_HOST|file-tran-hub-prod-kv|LEDS2BAIS-PROD-FTPS-destination"
                  "FTPS_FORWARD_TARGET_1_USERNAME|file-tran-hub-prod-kv|LEDS2BAIS-PROD-FTPS-Username"
                  "FTPS_FORWARD_TARGET_1_PASSWORD|file-tran-hub-prod-kv|LEDS2BAIS-PROD-FTPS-Password"
                  "FTPS_ADDITIONAL_USER|file-tran-hub-prod-kv|ho-moj-ftps-prod-username"
                  "FTPS_ADDITIONAL_PASSWORD|file-tran-hub-prod-kv|ho-moj-ftps-prod-password"
                )

                declare -A SECRET_ARGS_BY_REF=()
                SECRET_ARGS=()

                for mapping in "${SECRET_MAPPINGS[@]}"; do
                  IFS='|' read -r env_name key_vault_name key_vault_secret_name <<< "$mapping"

                  secret_ref=$(az containerapp show \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --query "properties.template.containers[0].env[?name=='${env_name}'].secretRef | [0]" \
                    --output tsv)

                  if [[ -z "$secret_ref" ]]; then
                    echo "$env_name secretRef was not found on $CONTAINER_APP_NAME" >&2
                    exit 1
                  fi

                  secret_value=$(az keyvault secret show \
                    --vault-name "$key_vault_name" \
                    --name "$key_vault_secret_name" \
                    --query value \
                    --output tsv)

                  if [[ -z "$secret_value" ]]; then
                    echo "Key Vault secret $key_vault_secret_name in $key_vault_name returned an empty value" >&2
                    exit 1
                  fi

                  SECRET_ARGS_BY_REF["$secret_ref"]="$secret_value"
                done

                for secret_ref in "${!SECRET_ARGS_BY_REF[@]}"; do
                  SECRET_ARGS+=("$secret_ref=${SECRET_ARGS_BY_REF[$secret_ref]}")
                done

                echo "Syncing FTPS runtime secrets into $CONTAINER_APP_NAME"
                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "${SECRET_ARGS[@]}"

                ACTIVE_REVISIONS=$(az containerapp revision list \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[?properties.active].name" \
                  --output tsv)

                if [[ -z "$ACTIVE_REVISIONS" ]]; then
                  echo "No active revisions found for $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                while IFS= read -r revision; do
                  [[ -z "$revision" ]] && continue
                  echo "Restarting revision: $revision"
                  az containerapp revision restart \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$revision"
                done <<< "$ACTIVE_REVISIONS"
