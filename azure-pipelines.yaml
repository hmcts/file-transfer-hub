                RESOURCE_GROUP="file-transfer-hub-nonprod-rg"

                SECRET_MAPPINGS=(
                  "FTPS_LOCAL_USER|file-tran-hub-nonprod-kv|ftps-local-username"
                  "FTPS_LOCAL_PASSWORD|file-tran-hub-nonprod-kv|ftps-local-password"
                  "FTPS_CERTIFICATE_PEM|acmedcdcftappsdemo|dtsft-demo-apps-hmcts-net"
                  "FTPS_CERTIFICATE_KEY_PEM|acmedcdcftappsdemo|dtsft-demo-apps-hmcts-net"
                  "FTPS_FORWARD_TARGET_0_USERNAME|file-tran-hub-nonprod-kv|ftps-storage-sftp-username"
                  "FTPS_FORWARD_TARGET_0_PASSWORD|file-tran-hub-nonprod-kv|ftps-storage-sftp-password"
                  "FTPS_FORWARD_TARGET_1_HOST|file-tran-hub-nonprod-kv|LEDS2BAIS-DEMO-FTPS-destination"
                  "FTPS_FORWARD_TARGET_1_USERNAME|file-tran-hub-nonprod-kv|LEDS2BAIS-DEMO-FTPS-Username"
                  "FTPS_FORWARD_TARGET_1_PASSWORD|file-tran-hub-nonprod-kv|LEDS2BAIS-DEMO-FTPS-Password"
                  "FTPS_ADDITIONAL_USER|file-tran-hub-nonprod-kv|ho-moj-ftps-demo-username"
                  "FTPS_ADDITIONAL_PASSWORD|file-tran-hub-nonprod-kv|ho-moj-ftps-demo-password"
                )

                declare -A SECRET_ARGS_BY_REF=()
                SECRET_ARGS=()

                for mapping in "${SECRET_MAPPINGS[@]}"; do
                  IFS='|' read -r env_name key_vault_name key_vault_secret_name <<< "$mapping"

                  secret_ref=$(az containerapp show \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --query "properties.template.containers[0].env[?name=='${env_name}'].secretRef | [0]" \
                    --output tsv)

