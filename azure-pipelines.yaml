trigger:
  batch: true
  branches:
    include:
      - main

pr:
  - main

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: "hmcts"

parameters:
  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy
  - name: refreshAlertsOnly
    displayName: "Refresh alert email addresses only (skip image build)"
    type: boolean
    default: false
  - name: refreshCertificateEnvironment
    displayName: "Restart Container App to reload renewed certificate from Key Vault"
    type: string
    default: none
    values:
      - none
      - nonprod
      - prod
  - name: refreshSecretsEnvironment
    displayName: "Sync all FTPS runtime secrets from Key Vault into the Container App"
    type: string
    default: none
    values:
      - none
      - nonprod
      - prod
  - name: sendLEDSNotificationEmail
    displayName: "Send LEDS notification email before certificate or secret refresh"
    type: boolean
    default: false
  - name: ledsNotificationRecipientEmailOverride
    displayName: "Override recipient email address (leave blank to use Key Vault)"
    type: string
    default: ""
  - name: ledsNotificationRecipientSecretName
    displayName: "Key Vault secret name holding the recipient email (used when override is blank)"
    type: string
    default: ftps-leds-notification-to-email
  - name: ledsNotificationSenderSecretName
    displayName: "Key Vault secret name holding the sender email address"
    type: string
    default: ftps-leds-notification-from-email
  - name: ledsNotificationMailRelaySecretName
    displayName: "Key Vault secret name holding the SMTP relay FQDN (hostname or hostname:port)"
    type: string
    default: ftps-leds-notification-mail-relay
  - name: environment_components
    type: object
    default:
      - deployment: "nonprod_core"
        environment: "nonprod"
        component: "core"
        service_connection: "HMCTS-HUB-NONPROD-INTSVC"
        dependsOn: "TerraformPrecheck"
      - deployment: "nonprod_container_app"
        environment: "nonprod"
        component: "container-app"
        service_connection: "HMCTS-HUB-NONPROD-INTSVC"
        dependsOn:
          - "nonprod_core"
          - "AppBuildPublish"
      - deployment: "prod_core"
        environment: "prod"
        component: "core"
        service_connection: "HMCTS-HUB-PROD-INTSVC"
        dependsOn: "nonprod_core"
      - deployment: "prod_container_app"
        environment: "prod"
        component: "container-app"
        service_connection: "HMCTS-HUB-PROD-INTSVC"
        dependsOn:
          - "prod_core"
          - "nonprod_container_app"

variables:
  - name: timeoutInMinutes
    value: 60
  - name: agentImage
    value: ubuntu-latest
  - name: product
    value: hub
  - name: terraformInitSubscription
    value: 04d27a32-7a07-48b3-95b8-3c8691e1a263
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries
  - name: imageRepository
    value: file-transfer-hub/ftps-server

stages:
  - stage: TerraformPrecheck
    dependsOn: []
    jobs:
      - job:
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: "infra-vault-nonprod"
              keyvaultSecret: "azure-devops-sp-token"
              serviceConnection: "azurerm-sandbox"
              overrideAction: ${{ parameters.overrideAction }}

  - stage: AppBuildPublish
    displayName: "App Build & Publish"
    dependsOn: []
    condition: and(succeeded(), eq('${{ parameters.refreshCertificateEnvironment }}', 'none'), eq('${{ parameters.refreshSecretsEnvironment }}', 'none'), ne('${{ parameters.refreshAlertsOnly }}', 'true'))
    jobs:
      - job: BuildAndPublish
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Build and push Docker image to ACR (az acr build)"
            inputs:
              azureSubscription: DCD-CNP-Prod
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(System.DefaultWorkingDirectory)/app
              inlineScript: |
                echo "Starting ACR build for $(imageRepository)"

                # Determine the correct branch name
                if [ "$(Build.Reason)" = "PullRequest" ]; then
                  BRANCH_NAME="$(System.PullRequest.SourceBranch)"
                else
                  BRANCH_NAME="$(Build.SourceBranch)"
                fi

                # Remove refs/heads/ prefix if present
                BRANCH_NAME="${BRANCH_NAME#refs/heads/}"

                # Replace / with - for valid Docker tag names
                BRANCH_NAME="${BRANCH_NAME//\//-}"

                echo "Using branch name: $BRANCH_NAME"

                az acr build --registry hmctsprod \
                  -t $(imageRepository):$(Build.BuildId) \
                  -t $(imageRepository):$BRANCH_NAME \
                  -t $(imageRepository):$BRANCH_NAME-$(Build.BuildId) \
                  .

  - ${{ each deployment in parameters.environment_components }}:
      - stage: ${{ deployment.deployment }}
        dependsOn: ${{ deployment.dependsOn }}
        ${{ if eq(deployment.component, 'core') }}:
          condition: and(eq('${{ parameters.refreshCertificateEnvironment }}', 'none'), eq('${{ parameters.refreshSecretsEnvironment }}', 'none'))
        ${{ if and(eq(deployment.component, 'container-app'), eq(deployment.environment, 'nonprod')) }}:
          condition: >-
            and(
              eq('${{ parameters.refreshCertificateEnvironment }}', 'none'),
              eq('${{ parameters.refreshSecretsEnvironment }}', 'none'),
              succeeded('${{ deployment.environment }}_core'),
              in(dependencies.AppBuildPublish.result, 'Succeeded', 'Skipped')
            )
          variables:
            - name: log_analytics_workspace_id
              value: $[stageDependencies.${{ deployment.environment
                }}_core.TerraformPlanApply.outputs['terraformOutputs.log_analytics_workspace_id']]
            - name: container_apps_subnet_id
              value: $[stageDependencies.${{ deployment.environment
                }}_core.TerraformPlanApply.outputs['terraformOutputs.container_apps_subnet_id']]
        ${{ if and(eq(deployment.component, 'container-app'), eq(deployment.environment, 'prod')) }}:
          condition: >-
            and(
              eq('${{ parameters.refreshCertificateEnvironment }}', 'none'),
              eq('${{ parameters.refreshSecretsEnvironment }}', 'none'),
              succeeded('${{ deployment.environment }}_core'),
              in(dependencies.AppBuildPublish.result, 'Succeeded', 'Skipped')
            )
          variables:
            - name: log_analytics_workspace_id
              value: $[stageDependencies.${{ deployment.environment
                }}_core.TerraformPlanApply.outputs['terraformOutputs.log_analytics_workspace_id']]
            - name: container_apps_subnet_id
              value: $[stageDependencies.${{ deployment.environment
                }}_core.TerraformPlanApply.outputs['terraformOutputs.container_apps_subnet_id']]
        jobs:
          - job: TerraformPlanApply
            pool: hmcts-cftptl-agent-pool
            timeoutInMinutes: ${{ variables.timeoutInMinutes }}
            steps:
              - ${{ if eq(deployment.component, 'container-app') }}:
                  - task: AzureCLI@2
                    displayName: "Resolve container app image"
                    inputs:
                      azureSubscription: ${{ deployment.service_connection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        REFRESH_ALERTS_ONLY="${{ parameters.refreshAlertsOnly }}"
                        if [[ "${REFRESH_ALERTS_ONLY,,}" == "true" ]]; then
                          echo "Refresh-alerts-only: looking up current container app image"
                          CURRENT_IMAGE=$(az containerapp show \
                            --name "hub-fth-ftps-server-${{ deployment.environment }}" \
                            --resource-group "file-transfer-hub-${{ deployment.environment }}-rg" \
                            --query "properties.template.containers[0].image" --output tsv)
                          echo "Resolved image: $CURRENT_IMAGE"
                          echo "##vso[task.setvariable variable=container_app_image]$CURRENT_IMAGE"
                        else
                          echo "##vso[task.setvariable variable=container_app_image]hmctsprod.azurecr.io/$(imageRepository):$(Build.BuildId)"
                        fi
              - template: steps/terraform.yaml@cnp-azuredevops-libraries
                parameters:
                  overrideAction: ${{ parameters.overrideAction }}
                  environment: ${{ deployment.environment}}
                  component: ${{ deployment.component }}
                  serviceConnection: ${{ deployment.service_connection }}
                  product: ${{ variables.product }}
                  terraformInitSubscription: ${{ variables.terraformInitSubscription }}
                  ${{ if eq(deployment.environment, 'nonprod') }}:
                    backendResourceGroupName: azure-control-stg-rg
                  ${{ if eq(deployment.component, 'container-app') }}:
                    planCommandOptions: >-
                      -var
                      "log_analytics_workspace_id=$(log_analytics_workspace_id)"
                      -var
                      "container_apps_subnet_id=$(container_apps_subnet_id)"
                      -var
                      "container_app_image=$(container_app_image)"
              - ${{ if eq(deployment.component, 'core') }}:
                  - task: AzureCLI@2
                    name: terraformOutputs
                    displayName: "Capture Terraform Outputs"
                    inputs:
                      azureSubscription: ${{ deployment.service_connection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        cd $(System.DefaultWorkingDirectory)/file-transfer-hub/components/core

                        export ARM_CLIENT_ID=$servicePrincipalId
                        export ARM_CLIENT_SECRET=$servicePrincipalKey
                        export ARM_TENANT_ID=$tenantId
                        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                        LOG_ANALYTICS_ID=$(terraform output -raw log_analytics_workspace_id)
                        SUBNET_ID=$(terraform output -raw container_apps_subnet_id)

                        echo "##vso[task.setvariable variable=log_analytics_workspace_id;isOutput=true]$LOG_ANALYTICS_ID"
                        echo "##vso[task.setvariable variable=container_apps_subnet_id;isOutput=true]$SUBNET_ID"

  - stage: NotifyLEDS
    displayName: "Send LEDS change notification"
    dependsOn:
      - TerraformPrecheck
    condition: >-
      and(
        succeeded('TerraformPrecheck'),
        eq('${{ parameters.sendLEDSNotificationEmail }}', 'true'),
        or(
          ne('${{ parameters.refreshCertificateEnvironment }}', 'none'),
          ne('${{ parameters.refreshSecretsEnvironment }}', 'none')
        )
      )
    jobs:
      - job: NotifyLEDSNonprod
        displayName: "Send nonprod LEDS change notification"
        condition: >-
          or(
            eq('${{ parameters.refreshCertificateEnvironment }}', 'nonprod'),
            eq('${{ parameters.refreshSecretsEnvironment }}', 'nonprod')
          )
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: "Send nonprod LEDS change notification"
            inputs:
              azureSubscription: HMCTS-HUB-NONPROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                ENVIRONMENT="nonprod"
                KEY_VAULT_NAME="file-tran-hub-nonprod-kv"
                RECIPIENT_SECRET_NAME="${{ parameters.ledsNotificationRecipientSecretName }}"
                SENDER_SECRET_NAME="${{ parameters.ledsNotificationSenderSecretName }}"
                MAIL_RELAY_SECRET_NAME="${{ parameters.ledsNotificationMailRelaySecretName }}"

                DOCS_DIR="$(System.DefaultWorkingDirectory)/docs"
                if [[ "${{ parameters.refreshCertificateEnvironment }}" == "$ENVIRONMENT" && "${{ parameters.refreshSecretsEnvironment }}" != "$ENVIRONMENT" ]]; then
                  TEMPLATE_PATH="$DOCS_DIR/leds-notification-certificate-change.txt"
                else
                  TEMPLATE_PATH="$DOCS_DIR/leds-notification-credential-change.txt"
                fi

                CHANGE_TYPE="FTPS runtime update"
                if [[ "${{ parameters.refreshCertificateEnvironment }}" == "$ENVIRONMENT" && "${{ parameters.refreshSecretsEnvironment }}" == "$ENVIRONMENT" ]]; then
                  CHANGE_TYPE="FTPS certificate and runtime secret update"
                elif [[ "${{ parameters.refreshCertificateEnvironment }}" == "$ENVIRONMENT" ]]; then
                  CHANGE_TYPE="FTPS certificate update"
                elif [[ "${{ parameters.refreshSecretsEnvironment }}" == "$ENVIRONMENT" ]]; then
                  CHANGE_TYPE="FTPS runtime secret update"
                fi

                RECIPIENT_EMAIL_OVERRIDE="${{ parameters.ledsNotificationRecipientEmailOverride }}"
                if [[ -n "$RECIPIENT_EMAIL_OVERRIDE" ]]; then
                  RECIPIENT_EMAIL="$RECIPIENT_EMAIL_OVERRIDE"
                  echo "Using recipient email override: $RECIPIENT_EMAIL"
                else
                  RECIPIENT_EMAIL=$(az keyvault secret show \
                    --vault-name "$KEY_VAULT_NAME" \
                    --name "$RECIPIENT_SECRET_NAME" \
                    --query value \
                    --output tsv)
                fi

                SENDER_EMAIL=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$SENDER_SECRET_NAME" \
                  --query value \
                  --output tsv)

                MAIL_RELAY=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$MAIL_RELAY_SECRET_NAME" \
                  --query value \
                  --output tsv)

                if [[ -z "$RECIPIENT_EMAIL" || -z "$SENDER_EMAIL" || -z "$MAIL_RELAY" ]]; then
                  echo "Notification recipient, sender, or mail relay secret is empty in $KEY_VAULT_NAME" >&2
                  exit 1
                fi

                PIPELINE_URL="$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=results"
                REQUESTED_BY="$(Build.RequestedFor)"
                TFVARS_FILE="$(System.DefaultWorkingDirectory)/environments/$ENVIRONMENT/$ENVIRONMENT.tfvars"
                PUBLIC_ENDPOINT=$(grep 'public_endpoint' "$TFVARS_FILE" | sed 's/.*=\s*"\(.*\)".*/\1/')

                EMAIL_BODY=$(sed \
                  -e "s|{{CHANGE_TYPE}}|$CHANGE_TYPE|g" \
                  -e "s|{{ENVIRONMENT}}|$ENVIRONMENT|g" \
                  -e "s|{{PUBLIC_ENDPOINT}}|$PUBLIC_ENDPOINT|g" \
                  -e "s|{{REQUESTED_BY}}|$REQUESTED_BY|g" \
                  -e "s|{{BUILD_NUMBER}}|$(Build.BuildNumber)|g" \
                  -e "s|{{PIPELINE_URL}}|$PIPELINE_URL|g" \
                  "$TEMPLATE_PATH")

                EMAIL_SUBJECT="File Transfer Hub $ENVIRONMENT $CHANGE_TYPE"
                EMAIL_FILE=$(mktemp)
                {
                  printf 'From: HMCTS File Transfer Hub <%s>\n' "$SENDER_EMAIL"
                  printf 'To: <%s>\n' "$RECIPIENT_EMAIL"
                  printf 'Subject: %s\n' "$EMAIL_SUBJECT"
                  printf 'Reply-To: %s\n' "$SENDER_EMAIL"
                  printf 'MIME-Version: 1.0\n'
                  printf 'Content-Type: text/plain; charset=UTF-8\n'
                  printf '\n'
                  printf '%s\n' "$EMAIL_BODY"
                } > "$EMAIL_FILE"

                echo "Sending LEDS notification email to $RECIPIENT_EMAIL via $MAIL_RELAY"
                curl --silent --show-error \
                  "smtp://$MAIL_RELAY" \
                  --mail-from "$SENDER_EMAIL" \
                  --mail-rcpt "$RECIPIENT_EMAIL" \
                  --upload-file "$EMAIL_FILE"
                rm -f "$EMAIL_FILE"
      - job: NotifyLEDSProd
        displayName: "Send prod LEDS change notification"
        condition: >-
          or(
            eq('${{ parameters.refreshCertificateEnvironment }}', 'prod'),
            eq('${{ parameters.refreshSecretsEnvironment }}', 'prod')
          )
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: "Send prod LEDS change notification"
            inputs:
              azureSubscription: HMCTS-HUB-PROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                ENVIRONMENT="prod"
                KEY_VAULT_NAME="file-tran-hub-prod-kv"
                RECIPIENT_SECRET_NAME="${{ parameters.ledsNotificationRecipientSecretName }}"
                SENDER_SECRET_NAME="${{ parameters.ledsNotificationSenderSecretName }}"
                MAIL_RELAY_SECRET_NAME="${{ parameters.ledsNotificationMailRelaySecretName }}"

                DOCS_DIR="$(System.DefaultWorkingDirectory)/docs"
                if [[ "${{ parameters.refreshCertificateEnvironment }}" == "$ENVIRONMENT" && "${{ parameters.refreshSecretsEnvironment }}" != "$ENVIRONMENT" ]]; then
                  TEMPLATE_PATH="$DOCS_DIR/leds-notification-certificate-change.txt"
                else
                  TEMPLATE_PATH="$DOCS_DIR/leds-notification-credential-change.txt"
                fi

                CHANGE_TYPE="FTPS runtime update"
                if [[ "${{ parameters.refreshCertificateEnvironment }}" == "$ENVIRONMENT" && "${{ parameters.refreshSecretsEnvironment }}" == "$ENVIRONMENT" ]]; then
                  CHANGE_TYPE="FTPS certificate and runtime secret update"
                elif [[ "${{ parameters.refreshCertificateEnvironment }}" == "$ENVIRONMENT" ]]; then
                  CHANGE_TYPE="FTPS certificate update"
                elif [[ "${{ parameters.refreshSecretsEnvironment }}" == "$ENVIRONMENT" ]]; then
                  CHANGE_TYPE="FTPS runtime secret update"
                fi

                RECIPIENT_EMAIL_OVERRIDE="${{ parameters.ledsNotificationRecipientEmailOverride }}"
                if [[ -n "$RECIPIENT_EMAIL_OVERRIDE" ]]; then
                  RECIPIENT_EMAIL="$RECIPIENT_EMAIL_OVERRIDE"
                  echo "Using recipient email override: $RECIPIENT_EMAIL"
                else
                  RECIPIENT_EMAIL=$(az keyvault secret show \
                    --vault-name "$KEY_VAULT_NAME" \
                    --name "$RECIPIENT_SECRET_NAME" \
                    --query value \
                    --output tsv)
                fi

                SENDER_EMAIL=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$SENDER_SECRET_NAME" \
                  --query value \
                  --output tsv)

                MAIL_RELAY=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$MAIL_RELAY_SECRET_NAME" \
                  --query value \
                  --output tsv)

                if [[ -z "$RECIPIENT_EMAIL" || -z "$SENDER_EMAIL" || -z "$MAIL_RELAY" ]]; then
                  echo "Notification recipient, sender, or mail relay secret is empty in $KEY_VAULT_NAME" >&2
                  exit 1
                fi

                PIPELINE_URL="$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=results"
                REQUESTED_BY="$(Build.RequestedFor)"
                TFVARS_FILE="$(System.DefaultWorkingDirectory)/environments/$ENVIRONMENT/$ENVIRONMENT.tfvars"
                PUBLIC_ENDPOINT=$(grep 'public_endpoint' "$TFVARS_FILE" | sed 's/.*=\s*"\(.*\)".*/\1/')

                EMAIL_BODY=$(sed \
                  -e "s|{{CHANGE_TYPE}}|$CHANGE_TYPE|g" \
                  -e "s|{{ENVIRONMENT}}|$ENVIRONMENT|g" \
                  -e "s|{{PUBLIC_ENDPOINT}}|$PUBLIC_ENDPOINT|g" \
                  -e "s|{{REQUESTED_BY}}|$REQUESTED_BY|g" \
                  -e "s|{{BUILD_NUMBER}}|$(Build.BuildNumber)|g" \
                  -e "s|{{PIPELINE_URL}}|$PIPELINE_URL|g" \
                  "$TEMPLATE_PATH")

                EMAIL_SUBJECT="File Transfer Hub $ENVIRONMENT $CHANGE_TYPE"
                EMAIL_FILE=$(mktemp)
                {
                  printf 'From: HMCTS File Transfer Hub <%s>\n' "$SENDER_EMAIL"
                  printf 'To: <%s>\n' "$RECIPIENT_EMAIL"
                  printf 'Subject: %s\n' "$EMAIL_SUBJECT"
                  printf 'Reply-To: %s\n' "$SENDER_EMAIL"
                  printf 'MIME-Version: 1.0\n'
                  printf 'Content-Type: text/plain; charset=UTF-8\n'
                  printf '\n'
                  printf '%s\n' "$EMAIL_BODY"
                } > "$EMAIL_FILE"

                echo "Sending LEDS notification email to $RECIPIENT_EMAIL via $MAIL_RELAY"
                curl --silent --show-error \
                  "smtp://$MAIL_RELAY" \
                  --mail-from "$SENDER_EMAIL" \
                  --mail-rcpt "$RECIPIENT_EMAIL" \
                  --upload-file "$EMAIL_FILE"
                rm -f "$EMAIL_FILE"
  - stage: RefreshCertificate
    displayName: "Reload renewed certificate from Key Vault"
    dependsOn:
      - TerraformPrecheck
      - NotifyLEDS
    condition: >-
      and(
        succeeded('TerraformPrecheck'),
        in(dependencies.NotifyLEDS.result, 'Succeeded', 'Skipped'),
        ne('${{ parameters.refreshCertificateEnvironment }}', 'none')
      )
    jobs:
      - job: RestartNonprodContainerApp
        displayName: "Restart active nonprod Container App revision(s)"
        condition: eq('${{ parameters.refreshCertificateEnvironment }}', 'nonprod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Restart active nonprod Container App revision(s)"
            inputs:
              azureSubscription: HMCTS-HUB-NONPROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                CONTAINER_APP_NAME="hub-fth-ftps-server-nonprod"
                RESOURCE_GROUP="file-transfer-hub-nonprod-rg"
                KEY_VAULT_NAME="acmedcdcftappsdemo"
                KEY_VAULT_SECRET_NAME="dtsft-demo-apps-hmcts-net"

                CERT_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_PEM'].secretRef | [0]" \
                  --output tsv)

                KEY_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_KEY_PEM'].secretRef | [0]" \
                  --output tsv)

                if [[ -z "$CERT_SECRET_REF" ]]; then
                  echo "FTPS_CERTIFICATE_PEM secretRef was not found on $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                CERTIFICATE_VALUE=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$KEY_VAULT_SECRET_NAME" \
                  --query value \
                  --output tsv)

                if [[ -z "$CERTIFICATE_VALUE" ]]; then
                  echo "Key Vault secret $KEY_VAULT_SECRET_NAME in $KEY_VAULT_NAME returned an empty value" >&2
                  exit 1
                fi

                SECRET_ARGS=("$CERT_SECRET_REF=$CERTIFICATE_VALUE")
                if [[ -n "$KEY_SECRET_REF" && "$KEY_SECRET_REF" != "$CERT_SECRET_REF" ]]; then
                  SECRET_ARGS+=("$KEY_SECRET_REF=$CERTIFICATE_VALUE")
                fi

                echo "Syncing latest certificate secret from $KEY_VAULT_NAME into $CONTAINER_APP_NAME"
                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "${SECRET_ARGS[@]}"

                echo "Looking up active revisions for $CONTAINER_APP_NAME in $RESOURCE_GROUP"

                ACTIVE_REVISIONS=$(az containerapp revision list \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[?properties.active].name" \
                  --output tsv)

                if [[ -z "$ACTIVE_REVISIONS" ]]; then
                  echo "No active revisions found for $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                while IFS= read -r revision; do
                  [[ -z "$revision" ]] && continue
                  echo "Restarting revision: $revision"
                  az containerapp revision restart \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$revision"
                done <<< "$ACTIVE_REVISIONS"
      - job: RestartProdContainerApp
        displayName: "Restart active prod Container App revision(s)"
        condition: eq('${{ parameters.refreshCertificateEnvironment }}', 'prod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Restart active prod Container App revision(s)"
            inputs:
              azureSubscription: HMCTS-HUB-PROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                CONTAINER_APP_NAME="hub-fth-ftps-server-prod"
                RESOURCE_GROUP="file-transfer-hub-prod-rg"
                KEY_VAULT_NAME="acmehmctshubprodintsvc"
                KEY_VAULT_SECRET_NAME="dtsft-prod-apps-hmcts-net"

                CERT_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_PEM'].secretRef | [0]" \
                  --output tsv)

                KEY_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_KEY_PEM'].secretRef | [0]" \
                  --output tsv)

                if [[ -z "$CERT_SECRET_REF" ]]; then
                  echo "FTPS_CERTIFICATE_PEM secretRef was not found on $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                CERTIFICATE_VALUE=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$KEY_VAULT_SECRET_NAME" \
                  --query value \
                  --output tsv)

                if [[ -z "$CERTIFICATE_VALUE" ]]; then
                  echo "Key Vault secret $KEY_VAULT_SECRET_NAME in $KEY_VAULT_NAME returned an empty value" >&2
                  exit 1
                fi

                SECRET_ARGS=("$CERT_SECRET_REF=$CERTIFICATE_VALUE")
                if [[ -n "$KEY_SECRET_REF" && "$KEY_SECRET_REF" != "$CERT_SECRET_REF" ]]; then
                  SECRET_ARGS+=("$KEY_SECRET_REF=$CERTIFICATE_VALUE")
                fi

                echo "Syncing latest certificate secret from $KEY_VAULT_NAME into $CONTAINER_APP_NAME"
                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "${SECRET_ARGS[@]}"

                echo "Looking up active revisions for $CONTAINER_APP_NAME in $RESOURCE_GROUP"

                ACTIVE_REVISIONS=$(az containerapp revision list \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[?properties.active].name" \
                  --output tsv)

                if [[ -z "$ACTIVE_REVISIONS" ]]; then
                  echo "No active revisions found for $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                while IFS= read -r revision; do
                  [[ -z "$revision" ]] && continue
                  echo "Restarting revision: $revision"
                  az containerapp revision restart \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$revision"
                done <<< "$ACTIVE_REVISIONS"
  - stage: RefreshSecrets
    displayName: "Reload FTPS runtime secrets from Key Vault"
    dependsOn:
      - TerraformPrecheck
      - NotifyLEDS
    condition: >-
      and(
        succeeded('TerraformPrecheck'),
        in(dependencies.NotifyLEDS.result, 'Succeeded', 'Skipped'),
        ne('${{ parameters.refreshSecretsEnvironment }}', 'none')
      )
    jobs:
      - job: RefreshNonprodContainerAppSecrets
        displayName: "Refresh nonprod FTPS Container App secrets"
        condition: eq('${{ parameters.refreshSecretsEnvironment }}', 'nonprod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Refresh nonprod FTPS Container App secrets"
