trigger:
  batch: true
  branches:
    include:
      - main

pr:
  - main

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: "hmcts"

parameters:
  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy
  - name: refreshAlertsOnly
    displayName: "Refresh alert email addresses only (skip image build)"
    type: boolean
    default: false
  - name: refreshCertificateEnvironment
    displayName: "Restart Container App to reload renewed certificate from Key Vault"
    type: string
    default: none
    values:
      - none
      - nonprod
      - prod
  - name: environment_components
    type: object
    default:
      - deployment: "nonprod_core"
        environment: "nonprod"
        component: "core"
        service_connection: "HMCTS-HUB-NONPROD-INTSVC"
        dependsOn: "TerraformPrecheck"
      - deployment: "nonprod_container_app"
        environment: "nonprod"
        component: "container-app"
        service_connection: "HMCTS-HUB-NONPROD-INTSVC"
        dependsOn:
          - "nonprod_core"
          - "AppBuildPublish"
      - deployment: "prod_core"
        environment: "prod"
        component: "core"
        service_connection: "HMCTS-HUB-PROD-INTSVC"
        dependsOn: "nonprod_core"
      - deployment: "prod_container_app"
        environment: "prod"
        component: "container-app"
        service_connection: "HMCTS-HUB-PROD-INTSVC"
        dependsOn:
          - "prod_core"
          - "nonprod_container_app"

variables:
  - name: timeoutInMinutes
    value: 60
  - name: agentImage
    value: ubuntu-latest
  - name: product
    value: hub
  - name: terraformInitSubscription
    value: 04d27a32-7a07-48b3-95b8-3c8691e1a263
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries
  - name: imageRepository
    value: file-transfer-hub/ftps-server

stages:
  - stage: TerraformPrecheck
    dependsOn: []
    jobs:
      - job:
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: "infra-vault-nonprod"
              keyvaultSecret: "azure-devops-sp-token"
              serviceConnection: "azurerm-sandbox"
              overrideAction: ${{ parameters.overrideAction }}

  - stage: AppBuildPublish
    displayName: "App Build & Publish"
    dependsOn: []
    condition: and(succeeded(), eq('${{ parameters.refreshCertificateEnvironment }}', 'none'), ne('${{ parameters.refreshAlertsOnly }}', 'true'))
    jobs:
      - job: BuildAndPublish
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Build and push Docker image to ACR (az acr build)"
            inputs:
              azureSubscription: DCD-CNP-Prod
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(System.DefaultWorkingDirectory)/app
              inlineScript: |
                echo "Starting ACR build for $(imageRepository)"

                # Determine the correct branch name
                if [ "$(Build.Reason)" = "PullRequest" ]; then
                  BRANCH_NAME="$(System.PullRequest.SourceBranch)"
                else
                  BRANCH_NAME="$(Build.SourceBranch)"
                fi

                # Remove refs/heads/ prefix if present
                BRANCH_NAME="${BRANCH_NAME#refs/heads/}"

                # Replace / with - for valid Docker tag names
                BRANCH_NAME="${BRANCH_NAME//\//-}"

                echo "Using branch name: $BRANCH_NAME"

                az acr build --registry hmctsprod \
                  -t $(imageRepository):$(Build.BuildId) \
                  -t $(imageRepository):$BRANCH_NAME \
                  -t $(imageRepository):$BRANCH_NAME-$(Build.BuildId) \
                  .

  - ${{ each deployment in parameters.environment_components }}:
      - stage: ${{ deployment.deployment }}
        dependsOn: ${{ deployment.dependsOn }}
        ${{ if eq(deployment.component, 'core') }}:
          condition: eq('${{ parameters.refreshCertificateEnvironment }}', 'none')
        ${{ if and(eq(deployment.component, 'container-app'), eq(deployment.environment, 'nonprod')) }}:
          condition: >-
            and(
              eq('${{ parameters.refreshCertificateEnvironment }}', 'none'),
              succeeded('${{ deployment.environment }}_core'),
              in(dependencies.AppBuildPublish.result, 'Succeeded', 'Skipped')
            )
          variables:
            - name: log_analytics_workspace_id
              value: $[stageDependencies.${{ deployment.environment
                }}_core.TerraformPlanApply.outputs['terraformOutputs.log_analytics_workspace_id']]
            - name: container_apps_subnet_id
              value: $[stageDependencies.${{ deployment.environment
                }}_core.TerraformPlanApply.outputs['terraformOutputs.container_apps_subnet_id']]
        ${{ if and(eq(deployment.component, 'container-app'), eq(deployment.environment, 'prod')) }}:
          condition: >-
            and(
              eq('${{ parameters.refreshCertificateEnvironment }}', 'none'),
              succeeded('${{ deployment.environment }}_core'),
              in(dependencies.AppBuildPublish.result, 'Succeeded', 'Skipped')
            )
          variables:
            - name: log_analytics_workspace_id
              value: $[stageDependencies.${{ deployment.environment
                }}_core.TerraformPlanApply.outputs['terraformOutputs.log_analytics_workspace_id']]
            - name: container_apps_subnet_id
              value: $[stageDependencies.${{ deployment.environment
                }}_core.TerraformPlanApply.outputs['terraformOutputs.container_apps_subnet_id']]
        jobs:
          - job: TerraformPlanApply
            pool: hmcts-cftptl-agent-pool
            timeoutInMinutes: ${{ variables.timeoutInMinutes }}
            steps:
              - ${{ if eq(deployment.component, 'container-app') }}:
                  - task: AzureCLI@2
                    displayName: "Resolve container app image"
                    inputs:
                      azureSubscription: ${{ deployment.service_connection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        REFRESH_ALERTS_ONLY="${{ parameters.refreshAlertsOnly }}"
                        if [[ "${REFRESH_ALERTS_ONLY,,}" == "true" ]]; then
                          echo "Refresh-alerts-only: looking up current container app image"
                          CURRENT_IMAGE=$(az containerapp show \
                            --name "hub-fth-ftps-server-${{ deployment.environment }}" \
                            --resource-group "file-transfer-hub-${{ deployment.environment }}-rg" \
                            --query "properties.template.containers[0].image" --output tsv)
                          echo "Resolved image: $CURRENT_IMAGE"
                          echo "##vso[task.setvariable variable=container_app_image]$CURRENT_IMAGE"
                        else
                          echo "##vso[task.setvariable variable=container_app_image]hmctsprod.azurecr.io/$(imageRepository):$(Build.BuildId)"
                        fi
              - template: steps/terraform.yaml@cnp-azuredevops-libraries
                parameters:
                  overrideAction: ${{ parameters.overrideAction }}
                  environment: ${{ deployment.environment}}
                  component: ${{ deployment.component }}
                  serviceConnection: ${{ deployment.service_connection }}
                  product: ${{ variables.product }}
                  terraformInitSubscription: ${{ variables.terraformInitSubscription }}
                  ${{ if eq(deployment.environment, 'nonprod') }}:
                    backendResourceGroupName: azure-control-stg-rg
                  ${{ if eq(deployment.component, 'container-app') }}:
                    planCommandOptions: >-
                      -var
                      "log_analytics_workspace_id=$(log_analytics_workspace_id)"
                      -var
                      "container_apps_subnet_id=$(container_apps_subnet_id)"
                      -var
                      "container_app_image=$(container_app_image)"
              - ${{ if eq(deployment.component, 'core') }}:
                  - task: AzureCLI@2
                    name: terraformOutputs
                    displayName: "Capture Terraform Outputs"
                    inputs:
                      azureSubscription: ${{ deployment.service_connection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        cd $(System.DefaultWorkingDirectory)/file-transfer-hub/components/core

                        export ARM_CLIENT_ID=$servicePrincipalId
                        export ARM_CLIENT_SECRET=$servicePrincipalKey
                        export ARM_TENANT_ID=$tenantId
                        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                        LOG_ANALYTICS_ID=$(terraform output -raw log_analytics_workspace_id)
                        SUBNET_ID=$(terraform output -raw container_apps_subnet_id)

                        echo "##vso[task.setvariable variable=log_analytics_workspace_id;isOutput=true]$LOG_ANALYTICS_ID"
                        echo "##vso[task.setvariable variable=container_apps_subnet_id;isOutput=true]$SUBNET_ID"

  - stage: RefreshCertificate
    displayName: "Reload renewed certificate from Key Vault"
    dependsOn:
      - TerraformPrecheck
    condition: >-
      and(
        succeeded('TerraformPrecheck'),
        ne('${{ parameters.refreshCertificateEnvironment }}', 'none')
      )
    jobs:
      - job: RestartNonprodContainerApp
        displayName: "Restart active nonprod Container App revision(s)"
        condition: eq('${{ parameters.refreshCertificateEnvironment }}', 'nonprod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Restart active nonprod Container App revision(s)"
            inputs:
              azureSubscription: HMCTS-HUB-NONPROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                CONTAINER_APP_NAME="hub-fth-ftps-server-nonprod"
                RESOURCE_GROUP="file-transfer-hub-nonprod-rg"
                KEY_VAULT_NAME="acmedcdcftappsdemo"
                KEY_VAULT_SECRET_NAME="dtsft-demo-apps-hmcts-net"

                CERT_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_PEM'].secretRef | [0]" \
                  --output tsv)

                KEY_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_KEY_PEM'].secretRef | [0]" \
                  --output tsv)

                if [[ -z "$CERT_SECRET_REF" ]]; then
                  echo "FTPS_CERTIFICATE_PEM secretRef was not found on $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                CERTIFICATE_VALUE=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$KEY_VAULT_SECRET_NAME" \
                  --query value \
                  --output tsv)

                if [[ -z "$CERTIFICATE_VALUE" ]]; then
                  echo "Key Vault secret $KEY_VAULT_SECRET_NAME in $KEY_VAULT_NAME returned an empty value" >&2
                  exit 1
                fi

                SECRET_ARGS=("$CERT_SECRET_REF=$CERTIFICATE_VALUE")
                if [[ -n "$KEY_SECRET_REF" && "$KEY_SECRET_REF" != "$CERT_SECRET_REF" ]]; then
                  SECRET_ARGS+=("$KEY_SECRET_REF=$CERTIFICATE_VALUE")
                fi

                echo "Syncing latest certificate secret from $KEY_VAULT_NAME into $CONTAINER_APP_NAME"
                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "${SECRET_ARGS[@]}"

                echo "Looking up active revisions for $CONTAINER_APP_NAME in $RESOURCE_GROUP"

                ACTIVE_REVISIONS=$(az containerapp revision list \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[?properties.active].name" \
                  --output tsv)

                if [[ -z "$ACTIVE_REVISIONS" ]]; then
                  echo "No active revisions found for $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                while IFS= read -r revision; do
                  [[ -z "$revision" ]] && continue
                  echo "Restarting revision: $revision"
                  az containerapp revision restart \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$revision"
                done <<< "$ACTIVE_REVISIONS"
      - job: RestartProdContainerApp
        displayName: "Restart active prod Container App revision(s)"
        condition: eq('${{ parameters.refreshCertificateEnvironment }}', 'prod')
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - task: AzureCLI@2
            displayName: "Restart active prod Container App revision(s)"
            inputs:
              azureSubscription: HMCTS-HUB-PROD-INTSVC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                CONTAINER_APP_NAME="hub-fth-ftps-server-prod"
                RESOURCE_GROUP="file-transfer-hub-prod-rg"
                KEY_VAULT_NAME="acmehmctshubprodintsvc"
                KEY_VAULT_SECRET_NAME="dtsft-prod-apps-hmcts-net"

                CERT_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_PEM'].secretRef | [0]" \
                  --output tsv)

                KEY_SECRET_REF=$(az containerapp show \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].env[?name=='FTPS_CERTIFICATE_KEY_PEM'].secretRef | [0]" \
                  --output tsv)

                if [[ -z "$CERT_SECRET_REF" ]]; then
                  echo "FTPS_CERTIFICATE_PEM secretRef was not found on $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                CERTIFICATE_VALUE=$(az keyvault secret show \
                  --vault-name "$KEY_VAULT_NAME" \
                  --name "$KEY_VAULT_SECRET_NAME" \
                  --query value \
                  --output tsv)

                if [[ -z "$CERTIFICATE_VALUE" ]]; then
                  echo "Key Vault secret $KEY_VAULT_SECRET_NAME in $KEY_VAULT_NAME returned an empty value" >&2
                  exit 1
                fi

                SECRET_ARGS=("$CERT_SECRET_REF=$CERTIFICATE_VALUE")
                if [[ -n "$KEY_SECRET_REF" && "$KEY_SECRET_REF" != "$CERT_SECRET_REF" ]]; then
                  SECRET_ARGS+=("$KEY_SECRET_REF=$CERTIFICATE_VALUE")
                fi

                echo "Syncing latest certificate secret from $KEY_VAULT_NAME into $CONTAINER_APP_NAME"
                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "${SECRET_ARGS[@]}"

                echo "Looking up active revisions for $CONTAINER_APP_NAME in $RESOURCE_GROUP"

                ACTIVE_REVISIONS=$(az containerapp revision list \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "[?properties.active].name" \
                  --output tsv)

                if [[ -z "$ACTIVE_REVISIONS" ]]; then
                  echo "No active revisions found for $CONTAINER_APP_NAME" >&2
                  exit 1
                fi

                while IFS= read -r revision; do
                  [[ -z "$revision" ]] && continue
                  echo "Restarting revision: $revision"
                  az containerapp revision restart \
                    --name "$CONTAINER_APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$revision"
                done <<< "$ACTIVE_REVISIONS"
